<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Bugungi obed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <span class="eyebrow" id="today-date">Bugun</span>
      <h1>Obed jadvali</h1>
    </header>

    <section class="panel">
      <h2>1. Taomingizni tanlang</h2>
      <div id="menu-list" class="menu-list"></div>

      <div class="my-summary">
        <span>Sizning summangiz</span>
        <strong id="my-total">0 so'm</strong>
      </div>

      <div class="actions">
        <button id="submit-btn" class="btn-primary">Buyurtmani yuborish</button>
        <button id="clear-btn" class="btn-ghost">Bekor qilish</button>
      </div>
      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <section class="panel">
      <h2>2. Bugungi umumiy jadval</h2>
      <div class="table-scroll">
        <table id="orders-table">
          <thead>
            <tr>
              <th>Ism</th>
              <th>Taomlar</th>
              <th class="num">Summa</th>
            </tr>
          </thead>
          <tbody id="orders-body">
            <tr class="empty-row"><td colspan="3">Hali hech kim buyurtma bermadi</td></tr>
          </tbody>
          <tfoot>
            <tr>
              <td colspan="2">Umumiy summa</td>
              <td class="num" id="grand-total">0 so'm</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
